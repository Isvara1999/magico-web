backend:
  name: github
  repo: Isvara1999/magico-web
  branch: main
  base_url: https://experienciamagico.com
  auth_endpoint: auth

# 'editorial_workflow' habilita el sistema de borradores.
# Esto evita que cada "Guardar" dispare un deploy a producción, ahorrando créditos.
publish_mode: editorial_workflow

# Dónde se guardan los archivos en el repositorio (relativo a la raíz del repo)
media_folder: "public/uploads"

# Cómo accede el navegador a los archivos (Vite sirve 'public' en la raíz)
public_folder: "/uploads"

# Se ha eliminado la configuración de Uploadcare que causaba conflictos si no estaba configurada.
# Ahora se usará el sistema de archivos de Git por defecto.

collections:
  - name: "content"
    label: "Contenido del Sitio"
    files:
      - name: "data"
        label: "Textos e Imágenes (ES/EN)"
        file: "data.json"
        fields:
          - name: "es"
            label: "🇪🇸 Español"
            widget: "object"
            fields:
              - name: "hero"
                label: "Hero (Inicio)"
                widget: "object"
                fields:
                  - {label: "Título", name: "title", widget: "string"}
                  - {label: "Subtítulo", name: "subtitle", widget: "text"}
                  - {label: "Botón Reserva", name: "btnBook", widget: "string"}
                  - {label: "Botón Retiro", name: "btnRetreat", widget: "string"}
                  - {label: "Años", name: "stats_years", widget: "string"}
                  - {label: "Árboles", name: "stats_trees", widget: "string"}
                  - {label: "Sustentable", name: "stats_sus", widget: "string"}
                  - {label: "Imagen de Fondo", name: "bgImage", widget: "image-editor"}
              - name: "about"
                label: "Sobre Nosotros"
                widget: "object"
                fields:
                  - {label: "Etiqueta", name: "tag", widget: "string"}
                  - {label: "Título (Markdown)", name: "title", widget: "markdown"}
                  - {label: "Párrafo 1", name: "p1", widget: "text"}
                  - {label: "Párrafo 2", name: "p2", widget: "text"}
                  - {label: "Texto Link", name: "link", widget: "string"}
                  - {label: "Imagen Principal", name: "image", widget: "image"}
              - name: "video"
                label: "Sección Video"
                widget: "object"
                fields:
                  - {label: "Título", name: "title", widget: "string"}
                  - {label: "URL del Video (MP4)", name: "videoUrl", widget: "string"}
                  - {label: "Imagen de Portada (Poster)", name: "poster", widget: "image"}
              - name: "experiences"
                label: "Experiencias"
                widget: "object"
                fields:
                  - {label: "Etiqueta", name: "tag", widget: "string"}
                  - {label: "Título", name: "title", widget: "string"}
                  - {label: "Subtítulo", name: "subtitle", widget: "string"}
                  - {label: "Botón General", name: "btn", widget: "string"}
                  - name: "cards"
                    label: "Tarjetas de Experiencia"
                    widget: "list"
                    fields:
                       - {label: "ID (Número único)", name: "id", widget: "number", value_type: "int"}
                       - {label: "Título", name: "title", widget: "string"}
                       - {label: "Descripción", name: "description", widget: "text"}
                       - {label: "Texto Botón", name: "ctaText", widget: "string"}
                       - {label: "Link Botón", name: "ctaLink", widget: "string"}
                       - {label: "Imagen", name: "image", widget: "image"}
              - name: "retreats"
                label: "Retiros"
                widget: "object"
                fields:
                  - {label: "Etiqueta", name: "tag", widget: "string"}
                  - {label: "Título (Markdown)", name: "title", widget: "markdown"}
                  - {label: "Descripción", name: "description", widget: "text"}
                  - {label: "Botón", name: "btn", widget: "string"}
                  - label: "Lista de Características"
                    name: "list"
                    widget: "list"
                    fields:
                      - {label: "Característica", name: "text", widget: "string"}
                  - label: "Imágenes Ilustrativas"
                    name: "images"
                    widget: "list"
                    min: 2
                    max: 2
                    fields:
                      - {label: "Imagen", name: "image", widget: "image"}
              - name: "volunteer"
                label: "Voluntariado"
                widget: "object"
                fields:
                   - {label: "Título (HTML)", name: "title", widget: "string"}
                   - {label: "Descripción", name: "description", widget: "text"}
                   - {label: "Botón", name: "btn", widget: "string"}
                   - {label: "Imagen", name: "image", widget: "image"}
              - name: "testimonials"
                label: "Testimonials"
                widget: "object"
                fields:
                  - {label: "Título", name: "title", widget: "string"}
                  - name: "items"
                    label: "Lista de Testimonios"
                    widget: "list"
                    fields:
                      - {label: "ID", name: "id", widget: "number", value_type: "int"}
                      - {label: "Nombre", name: "name", widget: "string"}
                      - {label: "Rol", name: "role", widget: "string"}
                      - {label: "Texto", name: "text", widget: "text"}
                      - {label: "Foto Persona", name: "image", widget: "image"}
              - name: "events"
                label: "Agenda / Eventos"
                widget: "object"
                fields:
                  - {label: "Etiqueta", name: "tag", widget: "string"}
                  - {label: "Título", name: "title", widget: "string"}
                  - {label: "Link Agenda Completa", name: "link", widget: "string"}
                  - name: "cards"
                    label: "Tarjetas de Eventos"
                    widget: "list"
                    fields:
                      - {label: "Fecha", name: "date", widget: "string"}
                      - {label: "Título", name: "title", widget: "string"}
                      - {label: "Descripción", name: "desc", widget: "text"}
                      - {label: "Texto Botón", name: "btn", widget: "string"}
                      - {label: "Imagen", name: "image", widget: "image"}
              - name: "location"
                label: "Ubicación"
                widget: "object"
                fields:
                   - {label: "Título (HTML)", name: "title", widget: "string"}
                   - {label: "Descripción", name: "description", widget: "text"}
                   - {label: "Botón Mapa", name: "btnMap", widget: "string"}
                   - {label: "Botón Traslado", name: "btnTransfer", widget: "string"}
                   - {label: "Imagen Mapa/Camino", name: "image", widget: "image"}
          
          - name: "en"
            label: "🇺🇸 Inglés"
            widget: "object"
            fields:
              - name: "hero"
                label: "Hero"
                widget: "object"
                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Subtitle", name: "subtitle", widget: "text"}
                  - {label: "Button Book", name: "btnBook", widget: "string"}
                  - {label: "Button Retreat", name: "btnRetreat", widget: "string"}
                  - {label: "Years", name: "stats_years", widget: "string"}
                  - {label: "Trees", name: "stats_trees", widget: "string"}
                  - {label: "Sustainable", name: "stats_sus", widget: "string"}
                  - {label: "Background Image", name: "bgImage", widget: "image"}
              - name: "about"
                label: "About Us"
                widget: "object"
                fields:
                  - {label: "Tag", name: "tag", widget: "string"}
                  - {label: "Title (Markdown)", name: "title", widget: "markdown"}
                  - {label: "Paragraph 1", name: "p1", widget: "text"}
                  - {label: "Paragraph 2", name: "p2", widget: "text"}
                  - {label: "Link Text", name: "link", widget: "string"}
                  - {label: "Main Image", name: "image", widget: "image"}
              - name: "video"
                label: "Video Section"
                widget: "object"
                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Video URL", name: "videoUrl", widget: "string"}
                  - {label: "Poster Image", name: "poster", widget: "image"}
              - name: "experiences"
                label: "Experiences"
                widget: "object"
                fields:
                  - {label: "Tag", name: "tag", widget: "string"}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Subtitle", name: "subtitle", widget: "string"}
                  - {label: "Button", name: "btn", widget: "string"}
                  - name: "cards"
                    label: "Cards"
                    widget: "list"
                    fields:
                       - {label: "ID", name: "id", widget: "number", value_type: "int"}
                       - {label: "Title", name: "title", widget: "string"}
                       - {label: "Description", name: "description", widget: "text"}
                       - {label: "Button Text", name: "ctaText", widget: "string"}
                       - {label: "Button Link", name: "ctaLink", widget: "string"}
                       - {label: "Image", name: "image", widget: "image"}
              - name: "retreats"
                label: "Retreats"
                widget: "object"
                fields:
                  - {label: "Tag", name: "tag", widget: "string"}
                  - {label: "Title (Markdown)", name: "title", widget: "markdown"}
                  - {label: "Description", name: "description", widget: "text"}
                  - {label: "Button", name: "btn", widget: "string"}
                  - label: "Features List"
                    name: "list"
                    widget: "list"
                    fields:
                      - {label: "Feature", name: "text", widget: "string"}
                  - label: "Images"
                    name: "images"
                    widget: "list"
                    min: 2
                    max: 2
                    fields:
                      - {label: "Image", name: "image", widget: "image"}
              - name: "volunteer"
                label: "Volunteering"
                widget: "object"
                fields:
                   - {label: "Title", name: "title", widget: "string"}
                   - {label: "Description", name: "description", widget: "text"}
                   - {label: "Button", name: "btn", widget: "string"}
                   - {label: "Image", name: "image", widget: "image"}
              - name: "testimonials"
                label: "Testimonials"
                widget: "object"
                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - name: "items"
                    label: "Items"
                    widget: "list"
                    fields:
                      - {label: "ID", name: "id", widget: "number", value_type: "int"}
                      - {label: "Name", name: "name", widget: "string"}
                      - {label: "Role", name: "role", widget: "string"}
                      - {label: "Text", name: "text", widget: "text"}
                      - {label: "Photo", name: "image", widget: "image"}
              - name: "events"
                label: "Events"
                widget: "object"
                fields:
                  - {label: "Tag", name: "tag", widget: "string"}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Link Text", name: "link", widget: "string"}
                  - name: "cards"
                    label: "Cards"
                    widget: "list"
                    fields:
                      - {label: "Date", name: "date", widget: "string"}
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Description", name: "desc", widget: "text"}
                      - {label: "Button Text", name: "btn", widget: "string"}
                      - {label: "Image", name: "image", widget: "image"}
              - name: "location"
                label: "Location"
                widget: "object"
                fields:
                   - {label: "Title", name: "title", widget: "string"}
                   - {label: "Description", name: "description", widget: "text"}
                   - {label: "Map Button", name: "btnMap", widget: "string"}
                   - {label: "Transfer Button", name: "btnTransfer", widget: "string"}
                   - {label: "Image", name: "image", widget: "image"}