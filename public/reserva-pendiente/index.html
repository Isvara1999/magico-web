<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pago en proceso — Pueblo Mágico</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" href="/favicon.svg" />
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Jost:wght@300;400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Jost:wght@300;400;500&display=swap"></noscript>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(circle at 20% 10%, #4a3a10 0%, #2d2408 45%, #1a1505 100%);
    font-family: 'Jost', system-ui, sans-serif;
    color: #1A1A1A;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: #F9F8F4;
    border-radius: 24px;
    padding: 48px 36px 40px;
    text-align: center;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
  }
  .logo {
    height: 34px;
    width: auto;
    margin-bottom: 32px;
    opacity: 0.85;
  }
  .icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: #D4AF37;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  .icon svg { width: 32px; height: 32px; }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 400;
    font-size: 1.75rem;
    line-height: 1.3;
    margin: 0 0 16px;
    color: #8a6d1a;
  }
  p.msg {
    font-size: 1rem;
    line-height: 1.6;
    color: #4a4a44;
    margin: 0 0 32px;
    font-weight: 300;
  }
  .btn {
    display: inline-block;
    width: 100%;
    padding: 15px 24px;
    border-radius: 999px;
    background: #005333;
    color: #F9F8F4;
    text-decoration: none;
    font-weight: 500;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(0, 83, 51, 0.3); }
  .footer {
    margin-top: 28px;
    font-size: 0.75rem;
    color: #9a9a92;
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/uploads/pueblo_magico_logo_marron.svg" alt="Pueblo Mágico" style="filter: brightness(0) saturate(100%) invert(19%) sepia(45%) saturate(1200%) hue-rotate(120deg) brightness(90%);" />
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#F9F8F4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v5l3.5 2" />
      </svg>
    </div>
    <h1>Tu pago está en proceso</h1>
    <p class="msg">Tu pago está siendo procesado. Te avisaremos por el chat apenas se confirme.</p>
    <a class="btn" href="https://wa.me/5493516765820" target="_blank" rel="noopener">Volver al chat</a>
    <div class="footer">Pueblo Mágico — Los Gigantes, Córdoba</div>
  </main>
</body>
</html>
