<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eco‑Refugio & Glamping — Mágico Ensueño</title>
  <meta name="description" content="Ecocentro en Sierras Grandes (Córdoba, AR): retiros, co‑living, glamping en domos y yurta, cocina de autor y naturaleza." />

  <link rel="icon" href="/favicon.svg" />
  <!-- LCP HERO PRELOAD (primer imagen del slider de la home) -->
  <link rel="preload" as="image" href="/uploads/img_8475.webp" fetchpriority="high">

  <!-- PRECONEXIONES (solo orígenes del critical path, máx 4) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- FUENTES: carga no-bloqueante para evitar render-blocking -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"></noscript>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap"></noscript>

  <!-- PWA CONFIG (Manifest & Theme) -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#005333">
  <link rel="apple-touch-icon" href="/favicon.svg">

  <!-- IDENTITY WIDGET PARA CMS (Necesario para que funcione el login actual) -->
  <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    html { scroll-behavior: smooth; }
    body { background-color: #F9F8F4; color: #1A1A1A; margin: 0; padding: 0; }
    #loader-container {
      height: 100vh; width: 100%; background-color: #F9F8F4;
      display: flex; justify-content: center; align-items: center;
      position: fixed; top: 0; left: 0; z-index: 9999;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  </style>

  <script>
    const ICON_LIGHT = "/uploads/logo negro.svg";
    function updateFavicon() {
      // Lógica simple para futuro soporte dark mode si es necesario
    }
  </script>
</head>
<body>

  <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="whatsapp" />
    <textarea name="message"></textarea>
    <input type="hidden" name="form-name" value="contact" />
  </form>

  <!-- Hidden Form para Netlify (Lead Magnet PDF Aula Verde) -->
  <form name="aula-verde-pdf" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="nombre_apellido" />
    <input type="text" name="colegio" />
    <input type="email" name="email" />
    <input type="tel" name="whatsapp" />
    <input type="hidden" name="form-name" value="aula-verde-pdf" />
  </form>

  <div id="root">
    <div id="loader-container">
      <img
        src="/uploads/logo negro.svg"
        style="height: 80px; width: auto; animation: pulse 2.5s infinite ease-in-out;"
        alt="Cargando..."
      />
    </div>
  </div>

  <!-- Entry Point para Vite -->
  <script type="module" src="/index.tsx"></script>

  <!-- Redirección del CMS Authentication -->
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }

    // Registrar Service Worker para soporte Offline y PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW registrado', reg))
          .catch(err => console.log('SW error', err));
      });
    }
  </script>
</body>
</html>
